<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hepta+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.png">

    <title>Trippo Games</title>
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">
        <img src="logo.png" alt="logo">
    </a>

    <nav>
        <ul class="nav-list">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="#games">Games</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#careers">Careers</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<main class="main">

    <section class="hero">
        <div class="hero-content">
            <h1>Made to Be Played</h1>
            <p>The Very Best in Mobile Gaming</p>

            <a href="#">
                <img src="appstore.avif" alt="App Store">
            </a>

            <a href="#">
                <img src="googleplay.avif" alt="Google Play">
            </a>
        </div>
    </section>

    <section class="games" id="games">
        <h2>Our Games</h2>

        <div class="games-container">

            <div class="robot1">
                <img src="Kipon.avif" alt="Kipon">
                <h2>Kipon</h2>
                <p>Casual - Free</p>
            </div>

            <div class="robot2">
                <img src="Robotrix.avif" alt="Robotrix">
                <h2>Robotrix</h2>
                <p>Action - Free</p>
            </div>

            <div class="robot3">
                <img src="Treasure Box.avif" alt="Treasure Box">
                <h2>Treasure Box</h2>
                <p>Puzzle - Free</p>
            </div>

        </div>
    </section>

    <section class="about" id="about">
        <h2>About Us</h2>
        <p>We create exciting mobile games for everyone.</p>
    </section>

    <section id="careers">
        <h2>Careers</h2>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
    </section>

</main>

<footer class="footer">
    <p>© 2026 Trippo Games</p>
</footer>

</body>
</html>
